[package]
name = "whodb-sdk"
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
description = "Official Rust SDK for the WhoDB hosted platform — ontology, datasets, and sources as in-code function APIs"
license = "Apache-2.0"
repository = "https://github.com/clidey/whodb"
keywords = ["whodb", "ontology", "database", "sdk"]
categories = ["api-bindings"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"
