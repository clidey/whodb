version: "2"

run:
  go: "1.22"

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
  exclusions:
    rules:
      - linters: [errcheck]
        source: "defer "
      - linters: [errcheck]
        path: "_test\\.go$"
      # Test files use obviously-fake keys (G101), write executable fake-CLI
      # scripts (G306), and read their own temp files (G304).
      - linters: [gosec]
        path: "_test\\.go$"
      # The conformance runner writes JSON lines to stdout; encode errors are
      # unrecoverable there.
      - linters: [errcheck]
        path: "cmd/conformance/"
      # G204: the CLI credential helper execs a fixed argv ("whodb auth
      # print-token") — the documented gcloud-ADC pattern, no user input.
      - linters: [gosec]
        text: "G204"
        path: "auth\\.go"

formatters:
  enable:
    - gofmt
