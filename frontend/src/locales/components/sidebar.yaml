  platformImportCredentialsSent: "தேர்ந்தெடுக்கப்பட்ட இணைப்புகளில் உள்ள கடவுச்சொற்கள், டோக்கன்கள் மற்றும் தனிப்பட்ட விசைகள் WhoDB தளத்திற்கு அனுப்பப்படும்."
  platformImportCredentialsReentry: "இணைப்பு ரகசியங்கள் இந்தச் சாதனத்தில் இருக்கும். நீங்கள் WhoDB தளத்தில் இறக்குமதியை மதிப்பாய்வு செய்யும் போது அவற்றை உள்ளிடவும்."
