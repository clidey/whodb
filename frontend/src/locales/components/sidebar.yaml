  platformImportDescription: "நிர்வகிக்கப்பட்ட ஆதாரங்களாக ஹோஸ்ட் செய்யப்பட்ட இயங்குதளத்திற்கு எடுத்துச் செல்ல வேண்டிய சேமித்த இணைப்புகளைத் தேர்வுசெய்யவும். உங்கள் உள்ளூர் பிரதிகள் இங்கேயே இருக்கும், முழுமையாக திருத்தக்கூடியவை — எதுவும் பூட்டப்படவில்லை அல்லது அகற்றப்படவில்லை."
