ta_IN:
  telemetryTitle: "டெலிமெட்ரி மற்றும் செயல்திறன் அளவீடுகள்"
  telemetryDescription: "{appName} இன் செயல்திறனை மேம்படுத்த மட்டுமே இந்தத் தகவலைப் பயன்படுத்துகிறோம்."
  dataCollectionDetails: "நாங்கள் எந்தத் தரவைச் சேகரிக்கிறோம், அது எவ்வாறு சேகரிக்கப்படுகிறது, சேமிக்கப்படுகிறது மற்றும் பயன்படுத்தப்படுகிறது என்பது பற்றிய விவரங்களுக்கு, எங்கள் {privacyPolicyLink} ஐப் பார்க்கவும்."
