  sensitiveDataInfo: "எங்களால் முடிந்தவரை முக்கியமான தகவல்களைத் திருத்துவதற்கு நாங்கள் நடவடிக்கை எடுத்துள்ளோம், மேலும் அவை எதையும் தியாகம் செய்யாமல் உங்களுக்கும் எங்கள் தேவைகளுக்கும் பொருந்துகிறதா என்பதைத் தொடர்ந்து மதிப்பீடு செய்வோம்."
  contactUsInfo: "எங்களுக்குச் சிறப்பாகச் சேவை செய்யக்கூடிய ஒரு கருவி உங்களுக்குத் தெரிந்தால், உங்களிடமிருந்து நாங்கள் கேட்க விரும்புகிறோம்! திரையின் கீழ் இடது மூலையில் உள்ள \"எங்களைத் தொடர்புகொள்\" விருப்பத்தின் மூலம் அணுகவும்."
