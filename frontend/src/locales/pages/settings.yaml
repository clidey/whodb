pa_IN:
  telemetryTitle: "ਟੈਲੀਮੈਟਰੀ ਅਤੇ ਪ੍ਰਦਰਸ਼ਨ ਮੈਟ੍ਰਿਕਸ"
  telemetryDescription: "ਅਸੀਂ ਇਸ ਜਾਣਕਾਰੀ ਦੀ ਵਰਤੋਂ ਸਿਰਫ਼ {appName} ਦੀ ਕਾਰਗੁਜ਼ਾਰੀ ਨੂੰ ਵਧਾਉਣ ਲਈ ਕਰਦੇ ਹਾਂ।"
  dataCollectionDetails: "ਅਸੀਂ ਕਿਹੜਾ ਡੇਟਾ ਇਕੱਠਾ ਕਰਦੇ ਹਾਂ, ਇਸ ਨੂੰ ਕਿਵੇਂ ਇਕੱਠਾ ਕੀਤਾ, ਸਟੋਰ ਕੀਤਾ ਅਤੇ ਵਰਤਿਆ ਜਾਂਦਾ ਹੈ, ਇਸ ਬਾਰੇ ਵੇਰਵਿਆਂ ਲਈ, ਕਿਰਪਾ ਕਰਕੇ ਸਾਡੇ {privacyPolicyLink} ਨੂੰ ਵੇਖੋ।"
  privacyPolicy: "ਪਰਾਈਵੇਟ ਨੀਤੀ"
  posthogInfo: "{appName} ਇਸ ਡੇਟਾ ਨੂੰ ਇਕੱਤਰ ਕਰਨ ਅਤੇ ਪ੍ਰਬੰਧਿਤ ਕਰਨ ਲਈ ਪੋਸਟਹੌਗ ਦੀ ਵਰਤੋਂ ਕਰਦਾ ਹੈ।"
  sensitiveDataInfo: "ਅਸੀਂ ਵੱਧ ਤੋਂ ਵੱਧ ਸੰਵੇਦਨਸ਼ੀਲ ਜਾਣਕਾਰੀ ਨੂੰ ਸੋਧਣ ਲਈ ਉਪਾਅ ਕੀਤੇ ਹਨ ਅਤੇ ਅਸੀਂ ਇਹ ਯਕੀਨੀ ਬਣਾਉਣ ਲਈ ਨਿਰੰਤਰ ਮੁਲਾਂਕਣ ਕਰਾਂਗੇ ਕਿ ਇਹ ਕਿਸੇ ਵੀ ਚੀਜ਼ ਦੀ ਕੁਰਬਾਨੀ ਦਿੱਤੇ ਬਿਨਾਂ ਤੁਹਾਡੀਆਂ ਅਤੇ ਸਾਡੀਆਂ ਜ਼ਰੂਰਤਾਂ ਦੇ ਅਨੁਕੂਲ ਹੈ।"
  contactUsInfo: "ਜੇ ਤੁਸੀਂ ਕਿਸੇ ਅਜਿਹੇ ਸਾਧਨ ਬਾਰੇ ਜਾਣਦੇ ਹੋ ਜੋ ਸਾਡੀ ਬਿਹਤਰ ਸੇਵਾ ਕਰ ਸਕਦਾ ਹੈ, ਤਾਂ ਅਸੀਂ ਤੁਹਾਡੇ ਤੋਂ ਸੁਣਨਾ ਪਸੰਦ ਕਰਾਂਗੇ! ਸਕ੍ਰੀਨ ਦੇ ਹੇਠਲੇ ਖੱਬੇ ਕੋਨੇ ਵਿੱਚ \"ਸਾਡੇ ਨਾਲ ਸੰਪਰਕ ਕਰੋ\" ਵਿਕਲਪ ਰਾਹੀਂ ਬੱਸ ਪਹੁੰਚੋ।"
  enableTelemetry: "ਟੈਲੀਮੈਟਰੀ ਚਾਲੂ ਹੈ"
  disableTelemetry: "ਟੈਲੀਮੈਟਰੀ ਅਯੋਗ ਹੈ"
