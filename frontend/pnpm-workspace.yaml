minimumReleaseAge: 10080

blockExoticSubdeps: true

trustPolicy: "no-downgrade"

strictDepBuilds: true

allowBuilds:
  core-js: false

ignoreScripts: true
preferFrozenLockfile: true
strictSsl: true
strictPeerDependencies: true
saveExact: true
auditLevel: high
verifyStoreIntegrity: true
minimumReleaseAgeExclude:
  - '@clidey/ux'
  - '@clidey/deptrust'
  - '@clidey/connparse'
