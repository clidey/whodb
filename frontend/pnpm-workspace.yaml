minimumReleaseAge: 10080

blockExoticSubdeps: true

trustPolicy: "no-downgrade"

strictDepBuilds: true

allowBuilds:
  core-js: false

ignoreScripts: true
preferFrozenLockfile: true
strictSsl: true
strictPeerDependencies: true
saveExact: true
auditLevel: high
verifyStoreIntegrity: true
minimumReleaseAgeExclude:
  - '@clidey/ux'
  # semver 6.3.2 and 5.7.3 restore provenance for the old lines Babel and
  # lighthouse need; drop after 2026-11-09.
  - semver@6.3.2
  - semver@5.7.3
  - '@clidey/deptrust'
  - '@clidey/connparse'
