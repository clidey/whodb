updates:
  - package-ecosystem: "gomod"
    directory: "/core"
#    multi-ecosystem-group: "all-go"
#    patterns: ["*"]
#    open-pull-requests-limit: 20
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  - package-ecosystem: "gomod"
    directory: "/desktop-ce"
#    multi-ecosystem-group: "all-go"
#    patterns: ["*"]
#    open-pull-requests-limit: 20
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  - package-ecosystem: "gomod"
    directory: "/desktop-common"
#    multi-ecosystem-group: "all-go"
#    patterns: ["*"]
#    open-pull-requests-limit: 20
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  - package-ecosystem: "gomod"
    directory: "/cli"
#    multi-ecosystem-group: "all-go"
#    patterns: ["*"]
#    open-pull-requests-limit: 20
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/frontend"
#    open-pull-requests-limit: 20
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
#    groups:
#      all-npm:
#        patterns: ["*"]

  # Platform SDK workspace (tools deps: graphql, yaml; TS package devDeps).
  - package-ecosystem: "npm"
    directory: "/sdk"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  # Python SDK (runtime dep: httpx).
  - package-ecosystem: "pip"
    directory: "/sdk/packages/python"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  # Go SDK (zero deps today; covers any future additions).
  - package-ecosystem: "gomod"
    directory: "/sdk/packages/go"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  # Rust SDK (runtime deps: serde, serde_json, ureq).
  - package-ecosystem: "cargo"
    directory: "/sdk/packages/rust"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  # Java SDK (runtime dep: jackson-databind; build plugins).
  - package-ecosystem: "maven"
    directory: "/sdk/packages/java"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directory: "/core"
#    multi-ecosystem-group: "all-docker"
#    patterns: ["*"]
#    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directory: "/docs"
#    multi-ecosystem-group: "all-docker"
#    patterns: ["*"]
#    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/.github"
#    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
#    groups:
#      all-actions:
#        patterns: ["*"]
