# Version updates come from Renovate. Every entry has
# open-pull-requests-limit: 0, which stops Dependabot version updates while
# keeping this file (and its registries) for security updates.
version: 2

updates:
  - package-ecosystem: "gomod"
    open-pull-requests-limit: 0
    directory: "/core"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    open-pull-requests-limit: 0
    directory: "/desktop-ce"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
