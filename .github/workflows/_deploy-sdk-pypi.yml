name: Deploy SDK PyPI Package

# Publishes whodb-sdk (the Python platform SDK, sdk/packages/python) via PyPI
# Trusted Publishing. Register the publisher on PyPI (project whodb-sdk) for repo clidey/whodb,
# workflow _deploy-sdk-pypi.yml, before the first run.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        type: string

# OIDC permissions for PyPI Trusted Publishing
permissions:
  contents: read
  id-token: write

jobs:
  publish-sdk-pypi:
    name: Publish whodb-sdk (PyPI)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            upload.pypi.org:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: sdk/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '25.6.0'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install workspace deps
        run: cd sdk && pnpm install --frozen-lockfile

      - name: Verify generated core is current
        run: cd sdk && node tools/generate-core.mjs --check

      - name: Stamp version
        env:
          VERSION: ${{ inputs.version }}
        run: cd sdk && node tools/sync-versions.mjs --set "$VERSION"

      - name: Build sdist and wheel
        run: |
          cd sdk/packages/python
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/packages/python/dist/
