# Shared frontend build workflow.
# Builds the frontend once and uploads it as an artifact for other jobs to download.
#
# Produces:
# - frontend-build-ce: compiled CE frontend consumed by platform build/deploy jobs.

name: Build Frontend

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            app.posthog.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            posthog-cloud-prod-us-east-1-app-assets.s3-accelerate.amazonaws.com:443
            s3.us-east-1.amazonaws.com:443
            release-assets.githubusercontent.com:443
            releases.posthog.com:443
            us.i.posthog.com:443
            us.posthog.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: ./frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          VITE_APP_VERSION: ${{ inputs.version }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:ce
          test -f build/.whodb-edition
          grep -qx 'ce' build/.whodb-edition

      # Upload source maps to PostHog for production error tracking
      - name: Upload source maps to PostHog
        uses: PostHog/upload-source-maps@991172e085213c222c61d2ba6a0b9e57c81e5066 # v2.0.0
        with:
          cli-version: "0.18.7"
          directory: frontend/build
          project-id: ${{ secrets.POSTHOG_PROJECT_ID }}
          api-key: ${{ secrets.POSTHOG_API_KEY }}
          release-version: ${{ inputs.version }}
          delete-after-upload: true
        continue-on-error: true

      # The upload step is continue-on-error, so a PostHog outage would leave its
      # delete-after-upload unperformed and the maps would reach the artifact and
      # the go:embed. They inline the original sources, so remove them here too:
      # the guarantee should not depend on a third party succeeding.
      - name: Ensure source maps are not shipped
        run: |
          find frontend/build -name '*.map' -type f -print -delete
          remaining=$(find frontend/build -name '*.map' -type f | wc -l | tr -d ' ')
          [ "$remaining" = "0" ] || { echo "::error::source maps remain in the build"; exit 1; }

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-build-ce
          path: frontend/build
          include-hidden-files: true
          retention-days: 7
