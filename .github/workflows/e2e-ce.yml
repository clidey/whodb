name: E2E Tests (CE)

# Runs Playwright E2E tests against all CE databases using a matrix strategy.
# A build job compiles the Go test binary once, then each database gets its own
# runner for resource isolation. A merge job combines all blob reports into a
# single HTML report.
#
# Independent jobs also run the CE CLI test suite (unit + SQLite/CLI/PostgreSQL
# E2E), the CE backend integration tests, and the CE SSL integration tests.

on:
#  schedule:
#    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      databases:
        description: 'Comma-separated databases to test, or "all"'
        required: false
        type: string
        default: 'all'
  workflow_call:
    inputs:
      databases:
        description: 'Comma-separated databases to test, or "all"'
        required: false
        type: string
        default: 'all'

permissions:
  contents: read

jobs:
  resolve-matrix:
    name: Resolve Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve database matrix
        id: resolve
        env:
          DATABASES_INPUT: ${{ inputs.databases }}
        run: |
          ALL='["postgres","mysql","mysql8","mariadb","tidb","sqlite","duckdb","mongodb","redis","elasticsearch","cockroachdb","clickhouse","memcached","valkey","dragonfly","opensearch","yugabytedb","questdb","ferretdb"]'
          if [ -z "$DATABASES_INPUT" ] || [ "$DATABASES_INPUT" = "all" ]; then
            MATRIX=$ALL
          else
            MATRIX=$(printf '%s' "$DATABASES_INPUT" | python3 -c "import sys,json;dbs=[d.strip() for d in sys.stdin.read().split(',') if d.strip()];print(json.dumps(dbs))")
          fi
          echo "matrix={\"database\":$MATRIX}" >> "$GITHUB_OUTPUT"

  build:
    name: Build Test Binary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Create frontend build placeholder
        run: mkdir -p core/build && echo '<!doctype html>' > core/build/index.html

      - name: Build CE test binary
        working-directory: core
        run: go test -coverpkg=./... -c -o server.test ./cmd/whodb

      - name: Upload test binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-binary
          path: core/server.test
          retention-days: 1

  e2e:
    name: E2E - ${{ matrix.database }}
    needs: [resolve-matrix, build]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Download test binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: warn
          name: test-binary
          path: core

      - name: Make binary executable
        run: chmod +x core/server.test

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y sqlite3 netcat-openbsd

      - name: Verify Docker Compose
        run: docker compose version

      - name: Create frontend build placeholder
        run: mkdir -p core/build && echo '<!doctype html>' > core/build/index.html

      - name: Run E2E tests (${{ matrix.database }})
        working-directory: frontend
        env:
          WHODB_SKIP_BUILD: "true"
        run: pnpm e2e:db:headless ${{ matrix.database }}

      - name: Upload blob report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.database }}
          path: frontend/e2e/reports/blobs/
          retention-days: 7

      - name: Upload test logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-logs-${{ matrix.database }}
          path: frontend/e2e/logs/
          retention-days: 7

      - name: Upload failure artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: e2e-failure-artifacts-${{ matrix.database }}
          path: frontend/e2e/reports/test-results/
          if-no-files-found: warn
          retention-days: 14

  cli-tests:
    name: CLI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y netcat-openbsd

      - name: Verify Docker Compose
        run: docker compose version

      - name: Run CLI tests
        run: bash dev/run-cli-tests.sh --skip-ee -v

  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Verify Docker Compose
        run: docker compose version

      - name: Run CE integration tests
        run: bash dev/run-backend-tests.sh ce-integration

      - name: Dump container logs on failure
        if: ${{ failure() }}
        run: docker compose -f dev/docker-compose.yml logs --tail=200

  backend-ssl:
    name: Backend SSL Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Verify Docker Compose
        run: docker compose version

      - name: Run CE SSL integration tests
        run: bash dev/run-backend-tests.sh ssl

      - name: Dump container logs on failure
        if: ${{ failure() }}
        run: docker compose -f dev/docker-compose.yml --profile ssl logs --tail=200

  merge-reports:
    name: Merge Reports
    needs: [e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Download all blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: warn
          pattern: blob-report-*
          path: all-blobs

      - name: Download all test logs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: warn
          pattern: e2e-logs-*
          path: all-logs

      - name: Flatten blob reports
        env:
          DATABASES: ${{ inputs.databases }}
        run: |
          mkdir -p merged-blobs
          if ls all-blobs/blob-report-* 1>/dev/null 2>&1; then
            # Multiple artifacts: download-artifact created per-artifact subdirectories
            for dir in all-blobs/blob-report-*; do
              [ -d "$dir" ] || continue
              db=$(basename "$dir")
              db=${db#blob-report-}
              for f in "$dir"/*.zip; do
                [ -f "$f" ] && cp "$f" "merged-blobs/${db}-$(basename "$f")"
              done
            done
          else
            # Single artifact: download-artifact extracted directly into all-blobs/
            for f in all-blobs/*.zip; do
              [ -f "$f" ] && cp "$f" "merged-blobs/${DATABASES}-$(basename "$f")"
            done
          fi

      - name: Merge reports
        run: |
          PLAYWRIGHT_HTML_OPEN=never \
          PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report \
          pnpm --dir frontend exec playwright merge-reports \
            ../merged-blobs \
            --reporter=html

      - name: Upload merged HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Write E2E summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## CE E2E Summary"
            echo
            echo "| Database | Result | Slow Files |"
            echo "| --- | --- | --- |"
            for dir in all-logs/e2e-logs-*; do
              [ -d "$dir" ] || continue
              db=$(basename "$dir")
              db=${db#e2e-logs-}
              log="$dir/$db.log"
              if [ ! -f "$log" ]; then
                log=$(find "$dir" -maxdepth 1 -name '*.log' | head -1)
              fi
              if [ -z "$log" ] || [ ! -f "$log" ]; then
                echo "| \`$db\` | no log uploaded |  |"
                continue
              fi
              result=$(grep -E '[0-9]+ (passed|failed|skipped|flaky)' "$log" | tail -1 | sed 's/^[[:space:]]*//' || true)
              result=${result//|/\\|}
              [ -n "$result" ] || result="no result line found"
              slow=$(grep 'Slow test file' "$log" | sed 's/^[[:space:]]*Slow test file: //' | awk 'BEGIN { first = 1 } { gsub(/\|/, "\\|"); if (!first) printf "<br>"; printf "%s", $0; first = 0 }' || true)
              [ -n "$slow" ] || slow="none"
              echo "| \`$db\` | $result | $slow |"
            done

            echo
            echo "### Recent Failures"
            any_failures=false
            for dir in all-logs/e2e-logs-*; do
              [ -d "$dir" ] || continue
              db=$(basename "$dir")
              db=${db#e2e-logs-}
              log="$dir/$db.log"
              if [ ! -f "$log" ]; then
                log=$(find "$dir" -maxdepth 1 -name '*.log' | head -1)
              fi
              [ -n "$log" ] && [ -f "$log" ] || continue
              if ! grep -Eq '(✘|[0-9]+ failed)' "$log"; then
                continue
              fi
              failures=$(grep -E '(✘|Error:|Timeout|failed)' "$log" | tail -20 || true)
              if [ -n "$failures" ]; then
                any_failures=true
                echo
                echo "<details><summary>$db</summary>"
                echo
                echo '```text'
                echo "$failures"
                echo '```'
                echo
                echo "</details>"
              fi
            done
            if [ "$any_failures" = "false" ]; then
              echo
              echo "No recent failure lines found in uploaded logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
