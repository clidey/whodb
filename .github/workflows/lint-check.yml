name: Lint, Test & Typecheck

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, release]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Changed areas
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.areas.outputs.core }}
      cli: ${{ steps.areas.outputs.cli }}
      frontend: ${{ steps.areas.outputs.frontend }}
      codegen: ${{ steps.areas.outputs.codegen }}
      sdk: ${{ steps.areas.outputs.sdk }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Map changed files to areas
        id: areas
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Pull requests run only the areas they touch; pushes and manual runs,
          # and any change under .github/, run everything.
          files=ALL
          if [ -n "$BASE" ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            files="$(git diff --name-only "$BASE" HEAD)"
          fi
          area() {
            if [ "$files" = ALL ] || grep -qE "^\.github/|$2" <<<"$files"; then echo "$1=true"; else echo "$1=false"; fi
          }
          {
            area core '^(core/|go\.work)'
            area cli '^(cli/|core/)'
            area frontend '^(frontend/|core/graph/)'
            area codegen '^(core/graph/|core/go\.(mod|sum)|frontend/)'
            area sdk '^(sdk/|core/graph/)'
          } >> "$GITHUB_OUTPUT"

  go-lint:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    name: Go Lint (Core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Install golangci-lint
        uses: ./.github/actions/install-go-tools
        with:
          cache-key: golangci-lint-v2.14.0
          tools: |
            golangci-lint|github.com/golangci/golangci-lint/v2/cmd/golangci-lint|v2.14.0

      - name: Lint
        run: |
          cd core
          golangci-lint custom
          ./custom-gcl run ./...

  cli-lint:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    name: Go Lint (CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Install golangci-lint
        uses: ./.github/actions/install-go-tools
        with:
          cache-key: golangci-lint-v2.14.0
          tools: |
            golangci-lint|github.com/golangci/golangci-lint/v2/cmd/golangci-lint|v2.14.0

      - name: Lint
        run: |
          cd cli
          golangci-lint run --config .golangci.yml ./...

  go-vet:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    name: Go Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Vet
        run: cd core && go vet ./...

  go-build:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    name: Go Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Build
        run: cd core && go build ./cmd/whodb

  go-test:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    name: Go Test (-race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Unit Tests (CE)
        run: |
          cd core
          export GOCACHE="$PWD/.gocache"
          mkdir -p "$GOCACHE"
          go test -race -count=10 ./src/... ./graph/...

  cli-test:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    name: Go Test (CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Unit Tests (CLI)
        run: |
          cd cli
          export GOCACHE="$PWD/.gocache"
          mkdir -p "$GOCACHE"
          go test ./cmd/... ./internal/... ./pkg/...

  frontend-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Build
        run: cd frontend && pnpm build:ce

  graphql-codegen-drift:
    needs: changes
    if: needs.changes.outputs.codegen == 'true'
    name: GraphQL Codegen Up To Date
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Regenerate and compare
        run: |
          (cd core && go generate .)
          (cd frontend && pnpm run generate)
          git diff --exit-code -- core/graph frontend/src/generated

  sdk-check:
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    name: SDK Generate Check & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: sdk/package.json
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: sdk/pnpm-lock.yaml

      - name: Install
        run: cd sdk && pnpm install --frozen-lockfile

      # Generated cores must match the committed spec snapshot exactly
      # (SDK_DESIGN.md §2.2 drift gate) and package versions must be lockstep.
      - name: Generate check
        run: cd sdk && node tools/generate-core.mjs --check

      - name: Version lockstep check
        run: cd sdk && node tools/sync-versions.mjs --check

      - name: Lint (TypeScript + tools)
        run: cd sdk && pnpm lint

      - name: Build
        run: cd sdk && pnpm -r --if-present run build

      # Installs the SDK's own dependencies from pyproject.toml (httpx, plus
      # ruff via the dev extra) so versions have one source of truth that
      # Renovate already watches.
      - name: Install Python deps
        run: python3 -m pip install --user -e 'sdk/packages/python[dev]'

      - name: Lint (Python)
        run: cd sdk/packages/python && python3 -m ruff check .

      - name: Tests
        run: cd sdk && pnpm -r test

      # Consumption tests of the BUILT artifacts (npm tarball, Python wheel):
      # catches broken exports maps / packaging that source-tree tests miss.
      - name: Pack test (TypeScript)
        run: cd sdk/packages/typescript && node scripts/pack-test.mjs

      - name: Pack test (Python wheel)
        run: bash sdk/packages/python/scripts/pack_test.sh

      - name: Conformance (TypeScript)
        run: cd sdk && node tools/conformance-runner.mjs --lang ts

      - name: Conformance (Python)
        run: cd sdk && node tools/conformance-runner.mjs --lang python

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: sdk/packages/go/go.mod

      - name: Install Go lint/security tools
        uses: ./.github/actions/install-go-tools
        with:
          cache-key: sdk-go-tools-golangci-v2.14.0-govulncheck-v1.8.0
          tools: |
            golangci-lint|github.com/golangci/golangci-lint/v2/cmd/golangci-lint|v2.14.0
            govulncheck|golang.org/x/vuln/cmd/govulncheck|v1.8.0

      - name: Go SDK build, vet, test
        env:
          GOWORK: off
        run: cd sdk/packages/go && go build ./... && go vet ./... && go test -race ./...

      - name: Go SDK lint + vulnerability scan
        env:
          GOWORK: off
        run: |
          cd sdk/packages/go
          golangci-lint run ./...
          govulncheck ./...

      - name: Conformance (Go)
        env:
          GOWORK: off
        run: cd sdk && node tools/conformance-runner.mjs --lang go

      - name: Cache cargo-audit
        id: cargo-audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2

      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Rust SDK build, clippy, test, audit
        run: |
          cd sdk/packages/rust
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo audit

      # Builds against the rust-version declared in Cargo.toml, so a dependency
      # bump that raises the real floor fails here instead of drifting silently.
      - name: Rust SDK MSRV check
        run: |
          cd sdk/packages/rust
          msrv=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --all-targets

      - name: Conformance (Rust)
        run: cd sdk && node tools/conformance-runner.mjs --lang rust

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: oracle
          java-version: '25'
          cache: maven
          cache-dependency-path: sdk/packages/java/pom.xml

      - name: Java SDK build and test
        run: cd sdk/packages/java && mvn -q --batch-mode verify

      - name: Conformance (Java)
        run: cd sdk && node tools/conformance-runner.mjs --lang java

  frontend-lint:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Lint
        run: cd frontend && pnpm lint

      - name: Typecheck
        run: cd frontend && pnpm typecheck

      - name: Unit Tests (analytics)
        run: cd frontend && pnpm test:analytics

      - name: Unit Tests (404 motion)
        run: cd frontend && pnpm test:not-found
