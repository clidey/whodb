name: Deploy SDK npm Package

# Publishes @clidey/whodb-sdk (the TypeScript platform SDK, sdk/packages/typescript)
# via npm Trusted Publishing. Version comes from calculate-version so SDKs
# share the repo release version (ee SDK_DESIGN.md §2.3).

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        type: string

# OIDC permissions for npm Trusted Publishers
permissions:
  contents: read
  id-token: write

jobs:
  publish-sdk-npm:
    name: Publish @clidey/whodb-sdk
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: sdk/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: sdk/pnpm-lock.yaml

      - name: Install
        run: cd sdk && pnpm install --frozen-lockfile

      - name: Verify generated core is current
        run: cd sdk && node tools/generate-core.mjs --check

      - name: Stamp version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd sdk
          # Stamps package manifests AND the in-code SDK_VERSION constants.
          node tools/sync-versions.mjs --set "$VERSION"

      - name: Build
        run: cd sdk/packages/typescript && pnpm run build

      - name: Test
        run: cd sdk/packages/typescript && pnpm test

      # npm refuses to publish a version twice, so a re-run of a release whose
      # publish already went through skips it and goes straight to verifying.
      - name: Publish
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if npm view "@clidey/whodb-sdk@$VERSION" version; then
            echo "@clidey/whodb-sdk@$VERSION is already published; skipping"
            exit 0
          fi
          cd sdk/packages/typescript && npm publish --access public --provenance

      # npm accepts the publish and then processes it; the version stays 404
      # until that finishes. 0.127.2 was still 404 at 10s and 0.139.0 took
      # 5m09s, one second longer than the 5 minutes this step then waited.
      - name: Verify publish
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for attempt in $(seq 1 90); do
            if npm view "@clidey/whodb-sdk@$VERSION" version; then
              exit 0
            fi
            echo "not visible yet (attempt $attempt/90); retrying in 10s"
            sleep 10
          done
          echo "package @clidey/whodb-sdk@$VERSION not visible after 15 minutes" >&2
          exit 1
