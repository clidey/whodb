name: Deploy SDK npm Package

# Publishes @clidey/whodb-sdk (the TypeScript platform SDK, sdk/packages/typescript)
# via npm Trusted Publishing. Version comes from calculate-version so SDKs
# share the repo release version (ee SDK_DESIGN.md §2.3).

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        type: string

# OIDC permissions for npm Trusted Publishers
permissions:
  contents: read
  id-token: write

jobs:
  publish-sdk-npm:
    name: Publish @clidey/whodb-sdk
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: sdk/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '25.6.0'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: sdk/pnpm-lock.yaml

      - name: Install
        run: cd sdk && pnpm install --frozen-lockfile

      - name: Verify generated core is current
        run: cd sdk && node tools/generate-core.mjs --check

      - name: Stamp version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd sdk
          # Stamps package manifests AND the in-code SDK_VERSION constants.
          node tools/sync-versions.mjs --set "$VERSION"

      - name: Build
        run: cd sdk/packages/typescript && pnpm run build

      - name: Test
        run: cd sdk/packages/typescript && pnpm test

      - name: Publish
        run: cd sdk/packages/typescript && npm publish --access public --provenance

      # npm read replicas can lag the publish by more than a few seconds, so
      # poll instead of a single fixed sleep (a 0.127.2 publish succeeded but
      # this step 404'd at 10s and failed the whole job).
      - name: Verify publish
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            if npm view "@clidey/whodb-sdk@$VERSION" version; then
              exit 0
            fi
            echo "not visible yet (attempt $attempt/30); retrying in 10s"
            sleep 10
          done
          echo "package @clidey/whodb-sdk@$VERSION not visible after 5 minutes" >&2
          exit 1
