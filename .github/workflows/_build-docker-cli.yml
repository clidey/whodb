name: Build CLI Docker Images

# Produces:
# - docker-cli-image-amd64: OCI layout tarball with SBOM + provenance attestations.
# - docker-cli-image-arm64: OCI layout tarball with SBOM + provenance attestations.
# The deploy workflow pushes these tarballs as-is, so the scanned image digest is the deployed digest.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build'
        required: true
        type: string
    outputs:
      amd64-artifact:
        description: 'AMD64 Docker artifact name'
        value: docker-cli-image-amd64
      arm64-artifact:
        description: 'ARM64 Docker artifact name'
        value: docker-cli-image-arm64

permissions:
  contents: read
  actions: write
  security-events: write

jobs:
  build-docker-cli:
    name: Build CLI Docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    environment: permission-required
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            44.225.180.214:443
            44.231.40.74:443
            api.github.com:443
            auth.docker.io:443
            check.trivy.dev:443
            dl-cdn.alpinelinux.org:443
            get.trivy.dev:443
            ghcr.io:443
            github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            proxy.golang.org:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            s3.us-east-1.amazonaws.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            mirror.gcr.io:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Stamp plugin.json version
        run: |
          PLUGIN_JSON="cli/external-plugin/whodb/.claude-plugin/plugin.json"
          jq --arg v "${{ inputs.version }}" '.version = $v' "$PLUGIN_JSON" > "$PLUGIN_JSON.tmp"
          mv "$PLUGIN_JSON.tmp" "$PLUGIN_JSON"

      - name: Build CLI Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./cli/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          sbom: true
          provenance: mode=max
          tags: clidey/whodb-cli:${{ inputs.version }}-${{ matrix.arch }}
          outputs: type=oci,dest=/tmp/whodb-cli-docker-${{ matrix.arch }}.tar
          cache-from: type=gha,scope=ce-cli-docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ce-cli-docker-${{ matrix.arch }}
          build-args: |
            VERSION=${{ inputs.version }}

      # Trivy reads OCI layouts from a directory, not from the tarball itself.
      - name: Extract OCI layout for scan
        run: |
          mkdir -p /tmp/whodb-cli-oci
          tar -xf /tmp/whodb-cli-docker-${{ matrix.arch }}.tar -C /tmp/whodb-cli-oci

      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/whodb-cli-oci
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF report
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: trivy-results.sarif
          category: whodb-cli-docker-${{ matrix.arch }}

      - name: Upload Trivy SARIF artifact
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-sarif-whodb-cli-docker-${{ matrix.arch }}
          path: trivy-results.sarif
          retention-days: 7

      - name: Upload Docker artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-cli-image-${{ matrix.arch }}
          path: /tmp/whodb-cli-docker-${{ matrix.arch }}.tar
          retention-days: 7
